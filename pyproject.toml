[project]
name = "decision-model"
version = "0.1.0"
description = "Fine-tune Gemma 3 270M as a calibrated decision model on LocalLLaMA/typed-decisions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # training / evaluation
    "torch>=2.14",
    "transformers>=5.19",
    "accelerate>=1.15",
    "safetensors>=0.8",
    "datasets>=5.1",
    "numpy>=2.5",
    "pandas>=3.0",
    "matplotlib>=3.11",
    "tqdm>=4.70",
    # publishing to the Hub
    "huggingface-hub>=2.2",
    "pyyaml>=6.0",
    "requests>=2.34",
    # notebook
    "jupyterlab>=4.6",
    "ipykernel>=7.4",
    "ipywidgets>=8.1",
    "nbformat>=5.11",
    "nbconvert>=7.17",
]

[tool.uv]
package = false
